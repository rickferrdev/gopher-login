info:
  name: Register User
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "username": "john_doe",
        "email": "john@example.com",
        "password": "secure123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
